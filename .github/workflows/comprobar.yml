# Comprueba que el proyecto compila (y pasa tipos y tests donde los hay) en cada pull request y en cada
# push a main. Se trabaja con una rama por tarea y un PR a main, que se fusiona con esta comprobación en verde.
name: Comprobar

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (con el contrato de la API en src/contrato)
        run: npm run check
      - run: npm run build
